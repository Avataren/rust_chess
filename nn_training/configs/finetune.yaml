seed: 42

training:
  batch_size: 2048
  epochs: 5          # short runs to avoid catastrophic forgetting
  lr: 0.0001         # higher start; cosine-decays to lr/100=1e-6 over 5 epochs
  weight_decay: 0.0001
  grad_clip: 1.0
  workers: 8
  pin_memory: true
  amp: true

model:
  input_dim: 24576
  hidden_dim: 512
  hidden2_dim: 32
  dropout: 0.05
  dual_perspective: true
  n_output_buckets: 8

loss:
  cp_weight: 0.5     # balanced: CP accuracy drives search quality; WDL adds robustness
  wdl_weight: 0.5

data:
  train_file: data/train.jsonl
  val_file: data/val.jsonl
  max_cp_abs: 800    # matches full-training clip; focuses gradient on undecided positions

export:
  output_path: artifacts/eval.onnx

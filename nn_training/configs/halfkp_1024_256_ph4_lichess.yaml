seed: 137

training:
  batch_size: 32768
  epochs: 50
  lr: 0.0001
  warmup_epochs: 3
  weight_decay: 0.0001
  grad_clip: 1.0
  workers: 8
  pin_memory: true
  amp: true
  persistent_workers: true
  prefetch_factor: 4
  preload_to_gpu: true   # 67M × 140 bytes ≈ 9.4 GB VRAM
  reset_best_val: true   # restore weights only; restart optimizer + scheduler

model:
  input_dim: 24576
  hidden_dim: 1024
  hidden2_dim: 256
  dropout: 0.05
  dual_perspective: true
  n_output_buckets: 8

loss:
  cp_weight: 0.9
  wdl_weight: 0.1

data:
  train_file: data/all_69m/train_all_69m.jsonl   # 67M clean Lichess depth-14 positions
  val_file: data/all_69m/val_all_69m.jsonl
  max_cp_abs: 800

export:
  output_path: artifacts/eval.onnx
# Phase 4 of 4 — final calibration on Lichess depth-14 positions (67M)
# Adapts the SF self-play base to the evaluation distribution used by our engine.
# Resume from Phase 3 checkpoint with fresh optimizer (lowest LR).
#
# Training command:
#   PYTHONPATH=. python3 scripts/train.py \
#     --config configs/halfkp_1024_256_ph4_lichess.yaml \
#     --resume artifacts/checkpoint.pt \
#     --tb-logdir runs/1024x256_ph4_lichess

seed: 42

# Fine-tune on Lichess puzzle positions labeled by Stockfish.
# Start from the current best checkpoint with a low LR to avoid
# catastrophic forgetting of the main training distribution.
#
# Usage:
#   python3 scripts/train.py --config configs/puzzle_finetune.yaml \
#     --resume artifacts/checkpoint_all_54m_1024_h64_8b_32kb_cp07.pt

training:
  batch_size: 16384
  epochs: 30
  lr: 0.00005          # ~20x lower than main training — conservative finetune
  warmup_epochs: 2
  weight_decay: 0.0001
  grad_clip: 1.0
  workers: 8
  pin_memory: true
  amp: true
  persistent_workers: true
  prefetch_factor: 4
  compile: true
  compile_mode: "default"

model:
  input_dim: 24576
  hidden_dim: 1024
  hidden2_dim: 64
  dropout: 0.1          # lower dropout than main training
  dual_perspective: true
  n_output_buckets: 8

loss:
  cp_weight: 0.9
  wdl_weight: 0.1

data:
  # Generated by: puzzle_bench --export-all + gen_puzzle_finetune_data.py
  # Replace with actual output path after running the pipeline.
  train_file: data/puzzle_ft/train_puzzle_ft.jsonl
  val_file:   data/puzzle_ft/val_puzzle_ft.jsonl
  max_cp_abs: 1200       # puzzles span a wider eval range than quiet positions

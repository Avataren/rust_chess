seed: 137

training:
  batch_size: 32768
  epochs: 200
  lr: 0.001
  warmup_epochs: 5
  weight_decay: 0.0001
  grad_clip: 1.0
  workers: 8
  pin_memory: true
  amp: true
  persistent_workers: true
  prefetch_factor: 4
  preload_to_gpu: false   # 369M positions (~50 GB) does not fit in VRAM; use DataLoader

model:
  input_dim: 24576
  hidden_dim: 1024
  hidden2_dim: 256
  dropout: 0.05
  dual_perspective: true
  n_output_buckets: 8

loss:
  cp_weight: 0.9
  wdl_weight: 0.1

data:
  # 67M clean Lichess depth-14 (depth-14 SF evals, side-to-move CP)
  # + 300M Stockfish test80-2024 self-play (÷2.96 SF units → CP, white-absolute)
  # = ~367M total training positions
  train_files:
    - data/all_69m/train_all_69m.jsonl      # 67M  — strips .jsonl → finds binary
    - data/t80_apr2024/merged               # 120M — no extension, binary direct
    - data/t80_mar2024/merged               # 90M
    - data/t80_may2024/merged               # 90M
  val_file: data/all_69m/val_all_69m.jsonl  # 6.4M — fixed val set from Lichess
  max_cp_abs: 800

export:
  output_path: artifacts/eval.onnx
# Architecture: hidden_dim=1024, hidden2_dim=256, 8 output buckets
# Inference: requires HIDDEN1=1024, HIDDEN2=256 in chess_evaluation/src/neural_eval.rs
# Training command:
#   PYTHONPATH=. python3 scripts/train.py \
#     --config configs/halfkp_dual_t80_369m_1024_256_8b.yaml \
#     --tb-logdir runs/1024x256_t80_369m_base

seed: 137

training:
  batch_size: 32768
  epochs: 200
  lr: 0.001
  warmup_epochs: 5
  weight_decay: 0.0001
  grad_clip: 1.0
  workers: 8
  pin_memory: true
  amp: true
  persistent_workers: true
  prefetch_factor: 4
  preload_to_gpu: true

model:
  input_dim: 24576
  hidden_dim: 768
  hidden2_dim: 64
  dropout: 0.05
  dual_perspective: true
  n_output_buckets: 8

loss:
  cp_weight: 0.9
  wdl_weight: 0.1

data:
  train_file: data/all_69m/train_all_69m.jsonl
  val_file:   data/all_69m/val_all_69m.jsonl
  max_cp_abs: 800

export:
  output_path: artifacts/eval.onnx
# From-scratch training: hidden_dim=768, hidden2_dim=64, dropout=0.0
# Inference: requires HIDDEN1=768, HIDDEN2=64 in chess_evaluation/src/neural_eval.rs

seed: 137

training:
  batch_size: 32768
  epochs: 200
  lr: 0.001
  warmup_epochs: 5
  weight_decay: 0.0001
  grad_clip: 1.0
  workers: 8
  pin_memory: true
  amp: true
  persistent_workers: true
  prefetch_factor: 4

model:
  input_dim: 24576
  hidden_dim: 1024
  hidden2_dim: 64
  dropout: 0.3
  dual_perspective: true
  n_output_buckets: 8

loss:
  cp_weight: 0.3
  wdl_weight: 0.7

data:
  train_file: data/all_54m/train_all_54m.jsonl
  val_file:   data/all_54m/val_all_54m.jsonl
  max_cp_abs: 800
# ~54M positions, 8 buckets, hidden_dim=1024
